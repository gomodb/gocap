version: "2"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - gocyclo
    - dupl
    - gosec
    - misspell
    - unparam
    - ineffassign
    - wsl_v5
    - exptostd
    - modernize
    - nonamedreturns
  
  settings:
    gosec:
      excludes:
        - G505
        - G401
        - G115

formatters:
  enable:
    - gofumpt
    - golines
  exclusions:
    paths:
      # Instrumentation embeds generated JavaScript with long string literals
      # that golines cannot split without changing the emitted script.
      - instrumentation.go
